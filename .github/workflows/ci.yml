# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOLANGCI_LINT_VERSION: v2.12.2

jobs:
  build-test:
    name: build & test (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make vet
      - run: make test
      # The snapshotter feeds layers to the ocicfs store from several workers,
      # so the unit tests also run under the race detector.
      - run: GOFLAGS=-race make test
      - run: make build

  # The tagged fs-verity build modes of ocicfs change whether the overlay
  # requires fs-verity and what -check reports, so the unit tests also run
  # in a build of each mode; the default (auto) build runs above.
  build-modes:
    name: vet & test (${{ matrix.tags }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tags: [ocicfs_verity_required, ocicfs_verity_off]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make GOFLAGS=-tags=${{ matrix.tags }} vet test

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          install-only: true
      - run: make lint

  e2e:
    name: devcontainer composefs e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Pre-fetch into the module cache the container bind-mounts and reuses,
      # so the build inside resolves its modules without network access.
      - name: Pre-fetch modules into the shared devcontainer cache
        run: GOMODCACHE=$HOME/.cache/cfs-snapshotter/go-mod go mod download
      # Builds the version-pinned devcontainer image and verifies the ocicfs-fed
      # composefs data plane through Docker.
      - run: ./devshell.sh make test-e2e
