# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOLANGCI_LINT_VERSION: v2.12.2
  # ocicfs is an internal module; the public proxy can't serve it, so builds
  # resolve it directly over git using a token that can read the repo.
  GOPRIVATE: github.com/foundriesio/ocicfs

jobs:
  build-test:
    name: build & test (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Authenticate to the internal ocicfs module
        run: git config --global url."https://x-access-token:${{ secrets.OCICFS_TOKEN }}@github.com/foundriesio/".insteadOf "https://github.com/foundriesio/"
      - run: make vet
      - run: make test
      # The snapshotter feeds layers to the ocicfs store from several workers,
      # so the unit tests also run under the race detector.
      - run: GOFLAGS=-race make test
      - run: make build

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Authenticate to the internal ocicfs module
        run: git config --global url."https://x-access-token:${{ secrets.OCICFS_TOKEN }}@github.com/foundriesio/".insteadOf "https://github.com/foundriesio/"
      - name: install golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          install-only: true
      - run: make lint

  e2e:
    name: devcontainer composefs e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Authenticate to the internal ocicfs module
        run: git config --global url."https://x-access-token:${{ secrets.OCICFS_TOKEN }}@github.com/foundriesio/".insteadOf "https://github.com/foundriesio/"
      # The devcontainer has no credentials for the internal ocicfs module, so
      # pre-fetch it here into the module cache the container bind-mounts and
      # reuses; the build inside then resolves ocicfs offline.
      - name: Pre-fetch modules into the shared devcontainer cache
        run: GOMODCACHE=$HOME/.cache/cfs-snapshotter/go-mod go mod download
      # Builds the version-pinned devcontainer image and verifies the ocicfs-fed
      # composefs data plane through Docker.
      - run: ./devshell.sh make test-e2e
